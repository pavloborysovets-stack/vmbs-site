<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Image viewer</title>
<style>html,body{margin:0;height:100%;background:#141C26;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
#s{position:absolute;inset:0 0 44px 0;display:flex;align-items:center;justify-content:center}
#s img{max-width:calc(100% - 120px);max-height:100%;object-fit:contain;display:block}
@media (max-width:600px){#s img{max-width:100%}}
button{position:absolute;top:50%;transform:translateY(-50%);background:rgba(20,28,38,.5);border:0;color:#fff;font:300 46px/1 Georgia,serif;cursor:pointer;padding:10px 16px;opacity:.85}
button:hover{opacity:1;color:#d9a679}#p{left:6px}#n{right:6px}
#c{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:14px;opacity:.8;padding:0 12px}</style></head>
<body><div id="s"><img id="im" alt=""></div><button id="p" aria-label="Previous">&#8249;</button><button id="n" aria-label="Next">&#8250;</button><div id="c"></div>
<script>
var d={l:[],i:0};try{d=JSON.parse(decodeURIComponent(location.hash.slice(1)))}catch(e){}
var L=(d.l||[]).filter(function(x){return /^https:\/\/pavloborysovets-stack\.github\.io\//.test(x[0])}),k=d.i||0;
var im=document.getElementById('im'),c=document.getElementById('c');
if(L.length<2){document.getElementById('p').style.display='none';document.getElementById('n').style.display='none'}
function show(i){if(!L.length)return;k=(i+L.length)%L.length;im.src=L[k][0];im.alt=L[k][1]||'';c.textContent=(L[k][1]||'')+(L.length>1?'  ·  '+(k+1)+' / '+L.length:'')}
document.getElementById('p').onclick=function(){show(k-1)};document.getElementById('n').onclick=function(){show(k+1)};
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')show(k-1);if(e.key==='ArrowRight')show(k+1)});
var x0=null;document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)show(k+(dx<0?1:-1));x0=null});
show(k);
</script></body></html>
